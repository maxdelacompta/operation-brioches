<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Opération Brioche — favicon</title>
  <desc id="desc">Une brioche dorée stylisée, avec sucre perlé, sur fond bleu nuit.</desc>
  <defs>
    <linearGradient id="brioche" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFD46E"/>
      <stop offset=".5" stop-color="#F99B1A"/>
      <stop offset="1" stop-color="#DC6106"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFBB48"/>
      <stop offset="1" stop-color="#D9650B"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#FFE7A4"/>
      <stop offset=".42" stop-color="#FFB53C"/>
      <stop offset="1" stop-color="#E77811"/>
    </linearGradient>
  </defs>
  <!-- Contrast is maintained at 16 × 16 px as well as larger sizes. -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#082F62"/>
  <path d="M13 34c-4-2-6-6-5-11 1-6 6-10 12-10 3 0 6 1 8 4 2-5 7-8 12-7 6 1 9 5 10 10 6 0 10 5 9 11 0 5-4 9-9 10L13 34Z" fill="url(#brioche)" stroke="#A84509" stroke-width="1.45" stroke-linejoin="round"/>
  <!-- Brioche à tête: soft raised crown -->
  <path d="M24 21c0-7 4-13 10-13s11 5 11 12c0 5-4 9-10 10-5 0-11-3-11-9Z" fill="url(#top)" stroke="#BC5C0C" stroke-width="1.3"/>
  <path d="M28 16c2-3 5-4 8-4" fill="none" stroke="#FFF0B8" stroke-width="2.7" stroke-linecap="round" opacity=".85"/>
  <path d="M12 30c-2-7 1-11 6-12m33 8c4 1 5 4 4 7" fill="none" stroke="#FFE6A1" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
  <!-- Lower fluted brioche base -->
  <path d="M12 35c5 3 14 5 20 5s16-2 20-5l-5 17c-1 4-8 6-15 6s-14-2-15-6L12 35Z" fill="url(#base)" stroke="#9F450E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M21 40l3 15m8-14v15m10-16-3 15" stroke="#FFE2A0" stroke-width="2.1" stroke-linecap="round" opacity=".65"/>
  <path d="M14 35c9 5 27 8 36 0" fill="none" stroke="#FFF1BC" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
  <!-- Simple pearl sugar accents, legible at favicon size -->
  <g fill="#FFF8EB" stroke="#FCE2BB" stroke-width=".45">
    <rect x="28" y="14" width="5" height="4" rx="1.5" transform="rotate(-19 30.5 16)"/>
    <rect x="36" y="18" width="4.5" height="4" rx="1.4" transform="rotate(20 38 20)"/>
    <rect x="19" y="24" width="4.5" height="4" rx="1.3" transform="rotate(15 21 26)"/>
    <rect x="44" y="29" width="4.5" height="4" rx="1.3" transform="rotate(-15 46 31)"/>
  </g>
</svg>
